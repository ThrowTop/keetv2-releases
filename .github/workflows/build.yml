name: Build

# Manual only: no pull_request or push triggers, so nothing from a fork ever runs here with the
# deploy keys. Sources are cloned to the same paths as on the owner's PC (the CMake presets and
# dev.ps1 name them), so keetv2 needs no CI-specific changes. The build log stays on the runner;
# only dev.ps1's one-line results (and its first error lines on failure) reach this public log.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (x.y.z); empty is the last release plus one patch
        required: false
      keetv2_ref:
        description: keetv2 commit or branch
        default: master
      macuikit_ref:
        description: MacUIKit commit or branch
        default: main
      publish:
        description: Publish (installed copies update to it); otherwise a draft
        type: boolean
        default: true

permissions:
  contents: write

# One release at a time: each picks its version and delta base from the newest published release,
# so two at once would build the same version. A second dispatch waits for the first to finish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # keetv2's slim LGPL FFmpeg (desktop/tools/ffmpeg/build.sh) in BtbN's build image, as keetv2's
  # own ffmpeg.yml does. Cached by everything that decides the output (FFmpeg tag, the image by
  # digest, the script's hash), so a cache hit is the build a miss would make. Only the FFmpeg build
  # leaves this job, as a one-day artifact for the Windows job, with the keetv2 commit it fetched:
  # the Windows job builds that same commit, even if the branch moves in between.
  ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      keetv2_sha: ${{ steps.source.outputs.keetv2_sha }}
    env:
      FFMPEG_TAG: n9.0.2
      # The image digest keetv2's ffmpeg.yml pins too; update both together.
      FFMPEG_IMAGE: ghcr.io/btbn/ffmpeg-builds/win64-gpl-shared-9.0@sha256:49e23d45202a3399249129ebeb42bc2afd91de642e8d9cea27de43b3ac9051d7
    steps:
      - name: Fetch the build script
        id: source
        env:
          KEETV2_KEY: ${{ secrets.KEETV2_DEPLOY_KEY }}
          KEETV2_REF: ${{ inputs.keetv2_ref }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/keetv2-key"; printf '%s\n' "$KEETV2_KEY" > "$key"; chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          src="$RUNNER_TEMP/keetv2"; git init -q "$src"
          git -C "$src" fetch -q --depth 1 git@github.com:ThrowTop/keetv2.git "$KEETV2_REF"
          git -C "$src" checkout -q FETCH_HEAD
          rm -f "$key"
          echo "keetv2_sha=$(git -C "$src" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cp "$src/desktop/tools/ffmpeg/build.sh" "$RUNNER_TEMP/ffmpeg-build.sh"
          rm -rf "$src"
          echo "SCRIPT_HASH=$(sha256sum "$RUNNER_TEMP/ffmpeg-build.sh" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=${FFMPEG_IMAGE##*@sha256:}" >> "$GITHUB_ENV"
      - id: cache
        uses: actions/cache@v6
        with:
          path: ffmpeg-keetv2
          key: ffmpeg-keetv2-${{ env.FFMPEG_TAG }}-${{ env.IMAGE_DIGEST }}-${{ env.SCRIPT_HASH }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$RUNNER_TEMP:/script:ro" -v "$PWD:/work" -w /work \
            "$FFMPEG_IMAGE" \
            bash /script/ffmpeg-build.sh "$FFMPEG_TAG" /work/ffmpeg-keetv2 > "$RUNNER_TEMP/ffmpeg.log" 2>&1 \
            || { tail -n 40 "$RUNNER_TEMP/ffmpeg.log"; exit 1; }
          sudo chown -R "$(id -u):$(id -g)" ffmpeg-keetv2
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-keetv2
          path: ffmpeg-keetv2
          retention-days: 1

  # keetv2's Qt6Gui.dll: qtbase 6.12.0 with MacUIKit's synchronized live-resize patch
  # (tools/qt/qtbase-6.12.0-synchronized-layout-resize.patch), built by keetv2's
  # desktop/tools/qt-gui/build.ps1 (only the Gui target; every other Qt file comes from the SDK the
  # Windows job installs). Cached by everything that decides the output (the script's hash, which
  # pins the qtbase commit, the patch's hash, the MSVC version), so a cache hit is the build a miss
  # would make. The patch ships in the package as the LGPL requires (licenses/Qt). Only the build
  # leaves this job, as a one-day artifact, with the MacUIKit commit it fetched: the Windows job
  # builds that same commit.
  qt-gui:
    needs: ffmpeg
    runs-on: windows-2025
    timeout-minutes: 90
    outputs:
      macuikit_sha: ${{ steps.source.outputs.macuikit_sha }}
    steps:
      - name: Fetch the build script and the patch
        id: source
        shell: pwsh
        env:
          KEETV2_KEY: ${{ secrets.KEETV2_DEPLOY_KEY }}
          MACUIKIT_KEY: ${{ secrets.MACUIKIT_DEPLOY_KEY }}
          # The commit the FFmpeg job fetched, not the branch again.
          KEETV2_REF: ${{ needs.ffmpeg.outputs.keetv2_sha }}
          MACUIKIT_REF: ${{ inputs.macuikit_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-Source([string]$Repository, [string]$Key, [string]$Ref) {
            $keyFile = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
            [IO.File]::WriteAllText($keyFile, ($Key -replace "`r", '') + "`n")
            $env:GIT_SSH_COMMAND = "ssh -i '$($keyFile.Replace('\', '/'))' -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            $path = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
            git init -q $path
            git -C $path fetch -q --depth 1 "git@github.com:$Repository.git" $Ref
            if ($LASTEXITCODE) { throw "Fetching $Repository $Ref failed." }
            git -C $path checkout -q FETCH_HEAD
            Remove-Item -LiteralPath $keyFile -Force
            return $path
          }
          $keetv2 = Get-Source ThrowTop/keetv2 $env:KEETV2_KEY $env:KEETV2_REF
          $macuikit = Get-Source ThrowTop/macuikit $env:MACUIKIT_KEY $env:MACUIKIT_REF
          $sha = git -C $macuikit rev-parse HEAD
          Write-Host "ThrowTop/macuikit $env:MACUIKIT_REF = $sha"
          "macuikit_sha=$sha" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          $script = Join-Path $env:RUNNER_TEMP 'qt-gui-build.ps1'
          $patch = Join-Path $env:RUNNER_TEMP 'qtbase-6.12.0-synchronized-layout-resize.patch'
          Copy-Item -LiteralPath (Join-Path $keetv2 'desktop\tools\qt-gui\build.ps1') -Destination $script
          Copy-Item -LiteralPath (Join-Path $macuikit 'tools\qt\qtbase-6.12.0-synchronized-layout-resize.patch') -Destination $patch
          Remove-Item -LiteralPath $keetv2, $macuikit -Recurse -Force
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msvc = (Get-Content (Join-Path $vs 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt') -TotalCount 1).Trim()
          "SCRIPT_HASH=$((Get-FileHash $script).Hash.ToLowerInvariant())" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PATCH_HASH=$((Get-FileHash $patch).Hash.ToLowerInvariant())" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "MSVC_VERSION=$msvc" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - id: cache
        uses: actions/cache@v6
        with:
          path: qt-gui
          key: qt-gui-6.12.0-msvc${{ env.MSVC_VERSION }}-${{ env.PATCH_HASH }}-${{ env.SCRIPT_HASH }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\qt-gui-build.ps1" -Patch "$env:RUNNER_TEMP\qtbase-6.12.0-synchronized-layout-resize.patch" `
            -Output "$env:GITHUB_WORKSPACE\qt-gui" -Work "$env:RUNNER_TEMP\kqg"
          if ($LASTEXITCODE) { throw 'Building Qt6Gui.dll failed.' }
      - uses: actions/upload-artifact@v7
        with:
          name: qt-gui-6.12.0
          path: qt-gui
          retention-days: 1

  windows:
    needs: [ffmpeg, qt-gui]
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Fetch sources
        shell: pwsh
        env:
          KEETV2_KEY: ${{ secrets.KEETV2_DEPLOY_KEY }}
          MACUIKIT_KEY: ${{ secrets.MACUIKIT_DEPLOY_KEY }}
          INPUTS_KEY: ${{ secrets.INPUTS_DEPLOY_KEY }}
          # The commits the FFmpeg and Qt Gui jobs fetched, not the branches again.
          KEETV2_REF: ${{ needs.ffmpeg.outputs.keetv2_sha }}
          MACUIKIT_REF: ${{ needs.qt-gui.outputs.macuikit_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          # keetv2 and MacUIKit with their commit history (no older trees or files) for the release
          # notes; the build inputs as a single commit.
          function Get-Source([string]$Repository, [string]$Key, [string]$Ref, [string]$Path, [string]$Filter = '--filter=tree:0', [switch]$Lfs) {
            $keyFile = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
            [IO.File]::WriteAllText($keyFile, ($Key -replace "`r", '') + "`n")
            $env:GIT_SSH_COMMAND = "ssh -i '$($keyFile.Replace('\', '/'))' -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            New-Item -ItemType Directory -Force -Path $Path | Out-Null
            git -C $Path init -q
            git -C $Path remote add origin "git@github.com:$Repository.git"
            if ($Lfs) {
              git -C $Path lfs install --local --skip-repo
              if ($LASTEXITCODE) { throw "Configuring Git LFS for $Repository failed." }
            }
            git -C $Path fetch -q $Filter origin $Ref
            if ($LASTEXITCODE) { throw "Fetching $Repository $Ref failed." }
            git -C $Path checkout -q FETCH_HEAD
            if ($LASTEXITCODE) { throw "Checking out $Repository $Ref failed." }
            $sha = git -C $Path rev-parse --short HEAD
            Write-Host "$Repository $Ref = $sha"
            "$(($Repository -split '/')[1] -replace '-', '_')_sha=$sha" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            Remove-Item -LiteralPath $keyFile -Force
          }
          git config --global core.autocrlf false
          Get-Source ThrowTop/keetv2 $env:KEETV2_KEY $env:KEETV2_REF 'C:\custom\code\keetv2'
          Get-Source ThrowTop/macuikit $env:MACUIKIT_KEY $env:MACUIKIT_REF 'C:\custom\code\MacUIKit'
          Get-Source ThrowTop/keetv2-build-inputs $env:INPUTS_KEY main 'C:\custom\code\macos27-research' '--depth=1' -Lfs

      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-keetv2
          path: C:\custom\code\keetv2\desktop\deps\ffmpeg-keetv2-n9.0.2

      # keetv2's CMake takes it from there (cmake/QtGuiDeps.cmake); a release requires it.
      - uses: actions/download-artifact@v8
        with:
          name: qt-gui-6.12.0
          path: C:\custom\code\keetv2\desktop\deps\qt-gui-6.12.0

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.12.0
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtimageformats qtshadertools
          dir: C:\
          cache: true
          # aqtinstall 3.3.0 cannot read Qt 6.12's per-compiler repository layout; this is the
          # head of its open fix (miurahr/aqtinstall#1048). Back to a release once one has it.
          aqtsource: git+https://github.com/jdpurcell/aqtinstall.git@6f0f842da47c744cdc814cd94da9828d934d7bf0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Worker dependencies
        working-directory: C:\custom\code\keetv2\worker
        run: npm ci --no-audit --no-fund

      # The newest published release: its full package is the base of this one's delta, and its
      # releases.win.json the feed this one extends. None yet: no delta.
      - name: Previous release
        shell: pwsh
        working-directory: C:\custom\code\keetv2\desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet tool restore | Out-Null
          dotnet vpk download github --repoUrl '${{ github.server_url }}/${{ github.repository }}' --outputDir dist\releases
          if ($LASTEXITCODE) {
            # Only "there is no release yet" may go on (the first release, with no delta). Any other
            # failure would build the wrong version, or one installed copies cannot update to.
            gh api 'repos/${{ github.repository }}/releases/latest' --silent 2>$null
            if (-not $LASTEXITCODE) { throw 'Downloading the previous release failed.' }
            Write-Host 'No previous release.'
            $global:LASTEXITCODE = 0
          }

      # The commit subjects since the newest published release, whose notes end in a hidden line
      # naming the commits it was built from. These subjects become public.
      - name: Release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = gh api 'repos/${{ github.repository }}/releases/latest' --jq .body 2>$null
          $global:LASTEXITCODE = 0
          $lines = [System.Collections.Generic.List[string]]::new()
          $built = @()
          foreach ($source in @(@{ Name = 'keetv2'; Path = 'C:\custom\code\keetv2' }, @{ Name = 'MacUIKit'; Path = 'C:\custom\code\MacUIKit' })) {
            $head = git -C $source.Path rev-parse HEAD
            $built += "$($source.Name) $head"
            $since = if ("$previous" -match "$($source.Name) ([0-9a-f]{40})") { $Matches[1] }
            if (-not $since) { continue }
            git -C $source.Path merge-base --is-ancestor $since $head 2>$null
            if ($LASTEXITCODE) { $global:LASTEXITCODE = 0; continue }
            $subjects = @(git -C $source.Path log --no-merges --format='- %s' "$since..$head")
            if ($subjects) { $lines.Add("## $($source.Name)"); $lines.Add(''); $lines.AddRange([string[]]$subjects); $lines.Add('') }
          }
          if (-not $lines.Count) { $lines.Add('No changes listed.'); $lines.Add('') }
          $lines.Add("<!-- built from $($built -join ', ') -->")
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllLines($notes, $lines)
          "RELEASE_NOTES=$notes" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # No tests or development tools: only what ships. dev.ps1 runs the staged app as installed
      # (bare PATH, packaged worker) before packing it.
      - name: Build and package
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        # dev.ps1 picks the version when none is given: the downloaded release's plus one patch.
        run: |
          if ($env:VERSION_INPUT -and $env:VERSION_INPUT -notmatch '^\d+\.\d+\.\d+$') { throw 'version must be x.y.z.' }
          & C:\custom\code\keetv2\desktop\dev.ps1 -Task package -Version $env:VERSION_INPUT -ReleaseNotes $env:RELEASE_NOTES `
            -CMakeArgument @('-DKEETV2_BUILD_TESTS=OFF', '-DKEETV2_BUILD_TOOLS=OFF',
              '-DKEETV2_SF_SYMBOLS_EXPORT=C:/custom/code/macos27-research/sf-symbols/public-attributes-v2.jsonl.gz')
          if ($LASTEXITCODE) { throw 'Packaging failed.' }
          $built = Get-ChildItem C:\custom\code\keetv2\desktop\dist\releases -Filter 'keetv2-desktop-*-full.nupkg' |
            ForEach-Object { if ($_.Name -match '-(\d+\.\d+\.\d+)-full\.nupkg$') { [version]$Matches[1] } } |
            Sort-Object -Descending | Select-Object -First 1
          "VERSION=$built" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Installed copies update from published releases only; a draft waits for the owner.
      - name: Release
        shell: pwsh
        working-directory: C:\custom\code\keetv2\desktop
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          $publish = @(if ($env:PUBLISH -eq 'true') { '--publish' })
          dotnet vpk upload github --repoUrl '${{ github.server_url }}/${{ github.repository }}' `
            --token '${{ github.token }}' --outputDir dist\releases --tag "v$env:VERSION" `
            --releaseName "keetv2 $env:VERSION" --targetCommitish '${{ github.sha }}' @publish
          if ($LASTEXITCODE) { throw 'vpk upload failed.' }
          gh release edit "v$env:VERSION" --repo '${{ github.repository }}' --notes-file $env:RELEASE_NOTES
          Get-Content $env:RELEASE_NOTES
